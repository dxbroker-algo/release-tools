name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - name: shellcheck
        run: shellcheck -s bash release.sh test/helpers/bin/gh test/helpers/bin/curl
      - name: bats
        run: bats --print-output-on-failure test/
      - name: check this PR's title with the action it ships
        if: github.event_name == 'pull_request'
        uses: ./pr-title
