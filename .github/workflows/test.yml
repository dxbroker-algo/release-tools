name: test

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The hard kill (design T-1723 §6 item 1, standing rule S-37): a hung job cannot hold a
    # runner. This job's p90 today is 1m 45s (the slowest of the last 20 runs: 1m 50s), so
    # 5 min never kills a run that works today.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install bats
        if: github.event.action != 'edited'
        run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - name: shellcheck
        if: github.event.action != 'edited'
        run: shellcheck -s bash release.sh ci-time.sh test/helpers/bin/gh test/helpers/bin/curl
      - name: bats
        if: github.event.action != 'edited'
        run: bats --print-output-on-failure test/
      - name: check this PR's title with the action it ships
        if: github.event_name == 'pull_request'
        uses: ./pr-title
      - name: check this PR's release note with the action it ships
        if: github.event_name == 'pull_request'
        uses: ./pr-note

  # ---------------------------------------------------------------------------
  # CI time (S-37) — design T-1723 §6 item 2: this run's own wall, from the first job's
  # start to the last job's end, the queue before the first job excluded (design §2).
  #
  # THE GATE (card H, T-1787, at T-1576's close): a wall over the 5 min limit fails this
  # run. The job has no continue-on-error, so the reporter's exit code is the run's verdict.
  #
  # `enforce` is the shared action's switch (lead ruling A4: T-1790 CI-TIME-ENFORCE adds it
  # to the action first). The action cannot fail a run until that lands, so the switch is
  # inert until then. This repo runs the action from its own tree, so it needs no re-pin;
  # the consumers (the extension, root-infra) pin the sha that carries it.
  #
  # It needs every other job and runs whatever they did (`always()`), so a red run is
  # reported too. It reads the run's jobs with the workflow's own token (one API call,
  # inside the workflow — no seat's quota): `actions: read`. The reporter's own runtime is
  # not in the wall — it reads the jobs while it is still running, so it has no completion
  # yet.
  # ---------------------------------------------------------------------------
  ci-time:
    name: CI time (S-37)
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: report this run's time, with the action it ships
        uses: ./ci-time
        with:
          limit: "5"
          enforce: "true"
