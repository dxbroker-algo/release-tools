name: release-tools ci-time
description: >-
  Report what this CI run cost: the wall from the first job's start to the last job's end (the
  queue before the first job excluded and reported apart), the table of the jobs, and the
  verdict against the limit. It also prints a warning naming any job that began or ended after
  this job started, because that job is missing from this job's `needs:` and shortens the wall
  silently. Report-only by default; with `enforce: "true"` it fails the run when the wall is over
  the limit, and fails closed when the run's jobs cannot be read. Run it as the last job, `if: always()`, with
  `needs:` every other job and `permissions: actions: read`. A rerun is measured on its own attempt
  (`GITHUB_RUN_ATTEMPT`): jobs carried over from earlier attempts are left out, the queue is from
  the attempt's own start, and a window mixing attempts fails with "mixed attempts".
inputs:
  limit:
    description: "The limit in minutes: 5 for a CI run, 20 for a prod CD run."
    default: "5"
  token:
    description: "A token that can read the run's jobs (actions: read)."
    default: ${{ github.token }}
  enforce:
    description: >-
      "true" fails the run when the wall is over the limit, or when the run's jobs could not be
      read (API error, no jobs, a truncated list). "false" is report-only: it never fails the run.
    default: "false"
  needs:
    description: >-
      The names of the jobs in this job's `needs:`, comma-separated. When set, the check
      re-reads the run's jobs (up to 60 s) until each of them reports completed, because the jobs
      API can lag. Jobs outside `needs:` are not waited on, and they are not in the wall: they are
      listed apart, under "outside this job's needs (not in the wall)", and the late-job warning
      skips them. Unset, every job that ran counts.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        CI_TIME_LIMIT_MINUTES: ${{ inputs.limit }}
        CI_TIME_ENFORCE: ${{ inputs.enforce }}
        CI_TIME_NEEDS: ${{ inputs.needs }}
      run: '"$GITHUB_ACTION_PATH/../ci-time.sh"'
